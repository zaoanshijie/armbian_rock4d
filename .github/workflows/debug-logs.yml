name: Debug failed run logs

# 已弃用：主工作流的 report-failure 任务会在构建失败时自动发布日志。
# 仅保留手动触发以备调试使用。
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dump-logs:
    runs-on: ubuntu-latest
    steps:
      - name: 导出指定运行的失败日志并发 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${RUN_ID:-38241709451}"
          gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed > /tmp/all.log || true
          tail -n 400 /tmp/all.log | sed 's/^\t/ | /' > /tmp/tail.log
          {
            echo "## 失败运行 ${RUN_ID} 日志尾部（400 行）"
            echo '```'
            cat /tmp/tail.log
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Debug: run ${RUN_ID} failure logs" \
            --body-file /tmp/body.md
