name: Build Armbian for Radxa Rock 4D

on:
  push:
    branches:
      - main
  schedule:
    # 每天 UTC 02:30 检查 armbian/ci 是否发布了新的稳定版本
    # 注意：GitHub 会在仓库 60 天无提交后自动停用计划任务
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（即使该版本镜像已存在）"
        type: boolean
        default: false
      kernel_branch:
        description: "内核分支"
        type: choice
        default: edge
        options:
          - edge
          - vendor
      ubuntu_release:
        description: "Ubuntu 用户空间版本"
        type: choice
        default: resolute
        options:
          - resolute
          - noble

# 需要写权限以创建 GitHub Release
permissions:
  contents: write

# 不允许两个构建同时运行：排队而不是取消
concurrency:
  group: armbian-rock-4d-build
  cancel-in-progress: false

jobs:
  check:
    name: 检查 Armbian 新版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      base: ${{ steps.check.outputs.base }}
      build_kde: ${{ steps.check.outputs.build_kde }}
      build_cli: ${{ steps.check.outputs.build_cli }}
    steps:
      - name: 计算目标版本并决定需要构建哪些镜像
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail

          # 取 armbian/ci 最新稳定 tag（形如 26.8.10）
          latest="$(gh api --paginate repos/armbian/ci/releases \
            --jq '.[] | .tag_name | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' \
            | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::在 armbian/ci 中找不到稳定版本"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$latest"
          # 注意：armbian/build action 会对传入的 armbian_version 再做一次
          # patch+1，所以镜像的实际版本号是最新稳定版 +2。
          # 这里直接算出最终版本（version），保证 Release tag、标题、
          # 镜像文件名版本和已有资产查找逻辑全部一致。
          base="${major}.${minor}.$((patch + 1))"
          version="${major}.${minor}.$((patch + 2))"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "armbian/ci 最新稳定版: ${latest} -> 目标镜像版本: ${version}"

          # 检查本仓库该版本的 Release 中已有哪些镜像
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${version}" \
            --jq '.assets[].name' 2>/dev/null || true)"
          if [ -z "$assets" ]; then
            echo "版本 ${version} 尚未构建过。"
          fi

          # KDE 镜像文件名以 _kde-plasma_desktop.img.xz 结尾；
          # CLI(server) 镜像没有任何 _desktop / _minimal 后缀
          kde_count="$(printf '%s\n' "$assets" | grep -cE '_kde-plasma_desktop\.img\.xz$' || true)"
          cli_count="$(printf '%s\n' "$assets" | grep '\.img\.xz$' | grep -cvE '_(desktop|minimal)' || true)"

          if [ "$FORCE" = "true" ]; then
            build_kde=true
            build_cli=true
          else
            if [ "${kde_count:-0}" -ge 1 ]; then build_kde=false; else build_kde=true; fi
            if [ "${cli_count:-0}" -ge 1 ]; then build_cli=false; else build_cli=true; fi
          fi

          echo "build_kde=${build_kde}" >> "$GITHUB_OUTPUT"
          echo "build_cli=${build_cli}" >> "$GITHUB_OUTPUT"
          echo "构建 KDE 镜像: ${build_kde}（已存在 ${kde_count:-0} 个）"
          echo "构建 CLI 镜像: ${build_cli}（已存在 ${cli_count:-0} 个）"

  build:
    name: 构建 ${{ matrix.ui == 'server' && 'CLI' || 'KDE' }} 镜像
    needs: check
    if: >-
      needs.check.outputs.build_kde == 'true' ||
      needs.check.outputs.build_cli == 'true'
    # 必须用 ubuntu-26.04（而非 ubuntu-latest=24.04）作为构建宿主机：
    # resolute 的 tar 需要 openat2 系统调用，24.04 的 qemu-user 8.2 不支持，
    # 会导致 linux-headers 安装进 arm64 rootfs 时失败
    # （上游问题 armbian/build#10713，维护者的解决方案就是用 resolute 宿主机）
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        ui:
          - kde-plasma
          - server
    steps:
      - name: 清理 runner 磁盘空间
        # 不能用 armbian_runner_clean（descriptinc/free-disk-space）：
        # 该动作在 ubuntu-26.04 镜像上因缺少 powershell 包而 apt 失败（exit 100）
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile 2>/dev/null || true
          df -h /
      - name: 使用 Armbian 构建框架构建镜像
        if: >-
          (matrix.ui == 'kde-plasma' && needs.check.outputs.build_kde == 'true') ||
          (matrix.ui == 'server' && needs.check.outputs.build_cli == 'true')
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_target: build
          armbian_board: radxa-rock-4d
          # 与官方 Rock 4D 镜像一致：edge 内核 + Ubuntu 26.04 LTS (resolute)
          armbian_kernel_branch: ${{ inputs.kernel_branch || 'edge' }}
          armbian_release: ${{ inputs.ubuntu_release || 'resolute' }}
          armbian_ui: ${{ matrix.ui }}
          # action 会对该值再做一次 patch+1，得到 version（稳定版+2）
          armbian_version: ${{ needs.check.outputs.base }}
          # 显式固定 Release tag，与 check 计算的 version 保持一致
          armbian_release_tag: ${{ needs.check.outputs.version }}
          # 先以 pre-release 上传，全部镜像就绪后由 promote 任务转正
          armbian_release_prerelease: true
          armbian_release_title: "Armbian ${{ needs.check.outputs.version }} for Radxa Rock 4D"
          armbian_release_body: |
            针对 Radxa Rock 4D（Rockchip RK3576）自动构建的 Armbian 镜像。

            包含的镜像：
            - Ubuntu CLI（server，无桌面）
            - Ubuntu KDE Plasma 桌面版

            说明：
            - 默认登录：root / 1234（首次登录会要求修改）
            - 构建框架：https://github.com/armbian/build
            - Armbian 出现新版本时会自动重新构建

  promote:
    name: 将 Release 转为正式版
    needs: [check, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 标记为 latest 并取消 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --prerelease=false --latest
          echo "Release ${VERSION} 已发布为正式版。"

  report-failure:
    name: 构建失败时发布日志到 Issue
    needs: [check, build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 将失败日志尾部发布到 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --log-failed > /tmp/all.log || true
          tail -n 300 /tmp/all.log | sed 's/^\t/ | /' > /tmp/tail.log
          {
            echo "## 工作流运行失败（run ${GITHUB_RUN_ID}）"
            echo ""
            echo "日志尾部（最后 300 行）："
            echo ""
            echo '```'
            cat /tmp/tail.log
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Build failed: run ${GITHUB_RUN_ID}" \
            --body-file /tmp/body.md
