name: One-shot release maintenance

# 一次性修正 Release 26.8.12 的标题并转正（该版本由旧版版本逻辑构建，
# 标题渲染成了 26.8.11）。运行一次后即无事可做，后续将删除本文件。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    steps:
      - name: 修正 Release 标题并标记为 latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "26.8.12" --repo "${GITHUB_REPOSITORY}" \
            --title "Armbian 26.8.12 for Radxa Rock 4D" \
            --prerelease=false --latest
          echo "Release 26.8.12 标题已修正并标记为 latest。"
